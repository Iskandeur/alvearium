<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>Alvearium</title>
  <link id="favicon" rel="icon" href="data:,">
  <style>
    :root {
      --bg: #f6f6f7;
      --lane: #ececee;
      --card: #ffffff;
      --text: #1b1b1f;
      --muted: #55555e;
      --faint: #8a8a93;
      --line: rgba(20, 20, 28, 0.08);
      --line-strong: rgba(20, 20, 28, 0.14);
      --shadow: 0 1px 2px rgba(16, 18, 27, 0.04), 0 1px 1px rgba(16, 18, 27, 0.03);
      --shadow-hover: 0 2px 8px rgba(16, 18, 27, 0.07), 0 1px 2px rgba(16, 18, 27, 0.05);
      --shadow-panel: -12px 0 40px rgba(16, 18, 27, 0.12);
      --accent: #4b5bdc;
      --accent-soft: rgba(75, 91, 220, 0.09);
      --danger: #c9453e;
      --danger-soft: rgba(201, 69, 62, 0.09);
      --ok: #2f8f5b;
      --ok-soft: rgba(47, 143, 91, 0.1);
      --chip: rgba(20, 20, 28, 0.05);
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      --radius: 12px;
      --radius-card: 10px;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0e0f11; --lane: #16171a; --card: #1d1e22; --text: #ececef; --muted: #a5a5ae; --faint: #74747d;
        --line: rgba(255, 255, 255, 0.06); --line-strong: rgba(255, 255, 255, 0.12);
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.3); --shadow-hover: 0 4px 14px rgba(0, 0, 0, 0.35); --shadow-panel: -12px 0 40px rgba(0, 0, 0, 0.5);
        --accent: #8d97ff; --accent-soft: rgba(141, 151, 255, 0.12); --danger: #f07a72; --danger-soft: rgba(240, 122, 114, 0.12);
        --ok: #6cc896; --ok-soft: rgba(108, 200, 150, 0.12); --chip: rgba(255, 255, 255, 0.06);
      }
    }
    :root[data-theme="dark"] {
      --bg: #0e0f11; --lane: #16171a; --card: #1d1e22; --text: #ececef; --muted: #a5a5ae; --faint: #74747d;
      --line: rgba(255, 255, 255, 0.06); --line-strong: rgba(255, 255, 255, 0.12);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3); --shadow-hover: 0 4px 14px rgba(0, 0, 0, 0.35); --shadow-panel: -12px 0 40px rgba(0, 0, 0, 0.5);
      --accent: #8d97ff; --accent-soft: rgba(141, 151, 255, 0.12); --danger: #f07a72; --danger-soft: rgba(240, 122, 114, 0.12);
      --ok: #6cc896; --ok-soft: rgba(108, 200, 150, 0.12); --chip: rgba(255, 255, 255, 0.06);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font: 14px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; font-feature-settings: "cv11", "ss01";
    }
    a { color: inherit; text-decoration: none; }
    [hidden] { display: none !important; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .mono { font-family: var(--mono); }

    /* Header */
    header {
      position: sticky; top: 0; z-index: 5;
      background: color-mix(in srgb, var(--bg) 86%, transparent);
      -webkit-backdrop-filter: saturate(1.4) blur(12px); backdrop-filter: saturate(1.4) blur(12px);
    }
    .wrap { max-width: 1320px; margin: 0 auto; padding: 0 24px; }
    .bar { display: flex; align-items: center; gap: 12px; height: 60px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; letter-spacing: -0.01em; flex: none; }
    .brand svg { display: block; color: var(--accent); }
    .search { flex: 1; max-width: 420px; position: relative; margin-left: 10px; }
    .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
    .search input {
      width: 100%; height: 34px; padding: 0 12px 0 32px; border-radius: 8px; border: 1px solid var(--line-strong);
      background: var(--card); outline: none;
    }
    .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .summary { margin-left: auto; display: flex; align-items: center; gap: 14px; color: var(--faint); font-size: 13px; white-space: nowrap; }
    .summary b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
    .summary .hot b { color: var(--accent); }
    .live { display: inline-flex; align-items: center; gap: 6px; }
    .live i { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); opacity: 0.6; }
    .live.on i { background: #3aa76d; opacity: 1; }
    .live.off i { background: var(--danger); opacity: 1; }
    .btn {
      display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 8px;
      border: 1px solid var(--line-strong); background: var(--card); font-size: 13px; font-weight: 500; white-space: nowrap;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    :root[data-theme="dark"] .btn.primary { color: #0e0f11; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #0e0f11; } }
    .btn.primary:hover { filter: brightness(1.06); color: #fff; }
    :root[data-theme="dark"] .btn.primary:hover { color: #0e0f11; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary:hover { color: #0e0f11; } }
    .btn.ghost { border-color: transparent; background: none; color: var(--muted); }

    /* Filter bar */
    .filters { display: flex; align-items: center; gap: 8px; padding-top: 2px; padding-bottom: 12px; flex-wrap: wrap; }
    .seg { display: inline-flex; background: var(--lane); border-radius: 8px; padding: 2px; }
    .seg button { border: 0; background: none; height: 28px; padding: 0 11px; border-radius: 6px; font-size: 13px; color: var(--muted); }
    .seg button[aria-pressed="true"] { background: var(--card); color: var(--text); box-shadow: var(--shadow); font-weight: 500; }
    .pick { position: relative; }
    .pick select {
      appearance: none; -webkit-appearance: none; height: 30px; padding: 0 26px 0 10px; border-radius: 999px;
      border: 1px dashed var(--line-strong); background: transparent; font-size: 12.5px; color: var(--muted); max-width: 150px; field-sizing: content;
    }
    .pick::after { content: ""; position: absolute; right: 11px; top: 12px; width: 5px; height: 5px; border-right: 1.5px solid var(--faint); border-bottom: 1.5px solid var(--faint); transform: rotate(45deg); pointer-events: none; }
    .pick select:hover { border-color: var(--accent); color: var(--text); }
    .chip {
      display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 4px 0 10px; border-radius: 999px;
      background: var(--accent-soft); color: var(--accent); font-size: 12.5px; font-weight: 500; max-width: 280px;
    }
    .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chip em { font-style: normal; opacity: 0.7; font-weight: 400; }
    .chip button { border: 0; background: none; color: inherit; width: 20px; height: 20px; border-radius: 50%; line-height: 1; font-size: 15px; padding: 0; }
    .chip button:hover { background: var(--accent-soft); }
    .clear { border: 0; background: none; color: var(--faint); font-size: 12.5px; padding: 0 4px; }
    .clear:hover { color: var(--accent); }
    .spacer { flex: 1; }

    /* Board */
    main { padding-top: 4px; padding-bottom: 48px; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
    .lane { background: var(--lane); border-radius: var(--radius); padding: 6px 6px 8px; min-height: 120px; }
    .laneHead { display: flex; align-items: center; gap: 8px; padding: 8px 8px 10px; }
    .laneHead h2 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: -0.005em; color: var(--muted); }
    .lane.primary .laneHead h2 { color: var(--text); }
    .count { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; font-weight: 500; }
    .lane.primary .count.hot { color: #fff; background: var(--accent); border-radius: 999px; padding: 0 7px; line-height: 18px; min-width: 18px; text-align: center; }
    :root[data-theme="dark"] .lane.primary .count.hot { color: #0e0f11; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .lane.primary .count.hot { color: #0e0f11; } }
    .cards { display: flex; flex-direction: column; gap: 6px; }
    .more { font-size: 12px; color: var(--faint); text-align: center; padding: 6px 0 2px; }

    /* Card */
    .card {
      display: block; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line);
      border-radius: var(--radius-card); box-shadow: var(--shadow); padding: 10px 12px 11px;
      transition: box-shadow 0.15s ease, border-color 0.15s ease; min-width: 0; cursor: pointer;
    }
    .card:hover { box-shadow: var(--shadow-hover); border-color: var(--line-strong); }
    .card.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .card.dim { opacity: 0.62; }
    .head { display: flex; align-items: flex-start; gap: 9px; min-width: 0; }
    .dot { flex: none; width: 8px; height: 8px; margin-top: 6px; border-radius: 50%; border: 1.5px solid var(--faint); }
    [data-status="waiting_on_user"] > .head .dot, .dot[data-s="waiting_on_user"] { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    [data-status="failed"] > .head .dot, .dot[data-s="failed"] { background: var(--danger); border-color: var(--danger); box-shadow: 0 0 0 3px var(--danger-soft); }
    [data-status="in_progress"] > .head .dot, .dot[data-s="in_progress"] { border-color: var(--accent); }
    [data-status="in_progress"][data-live="1"] > .head .dot { animation: pulse 2.4s ease-in-out infinite; }
    [data-status="review"] > .head .dot, .dot[data-s="review"] { background: var(--muted); border-color: var(--muted); }
    [data-status="done"] > .head .dot, .dot[data-s="done"] { background: var(--ok); border-color: var(--ok); opacity: 0.7; }
    [data-status="cancelled"] > .head .dot, .dot[data-s="cancelled"] { border-style: dashed; opacity: 0.6; }
    @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 var(--accent-soft); } 50% { box-shadow: 0 0 0 4px var(--accent-soft); } }
    @media (prefers-reduced-motion: reduce) { [data-status="in_progress"] > .head .dot { animation: none; } }
    .title { flex: 1; min-width: 0; margin: 0; font-size: 14px; font-weight: 500; letter-spacing: -0.006em; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.38; }
    .key { flex: none; font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; padding-top: 2px; }
    .reason { margin: 7px 0 0 17px; font-size: 13px; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
    .reason .k { font-weight: 600; color: var(--accent); margin-right: 6px; }
    [data-status="failed"] .reason .k { color: var(--danger); }
    .reason code, .md code { font-family: var(--mono); font-size: 12px; background: var(--accent-soft); border-radius: 5px; padding: 1px 5px; }
    .note { margin: 6px 0 0 17px; font-size: 12.5px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
    .tags { margin: 8px 0 0 17px; display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; font-size: 12px; color: var(--faint); }
    .tag {
      display: inline-flex; align-items: center; gap: 4px; max-width: 100%; height: 20px; padding: 0 7px; border-radius: 6px;
      background: var(--chip); color: var(--muted); border: 0; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    button.tag:hover { color: var(--accent); background: var(--accent-soft); }
    .tag.sess { max-width: 190px; display: inline-block; line-height: 20px; }
    .tag.lbl { background: none; border: 1px solid var(--line-strong); }
    .tag.prio-urgent, .tag.prio-high { color: var(--danger); background: var(--danger-soft); }
    .tags .age { margin-left: auto; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .tags a:hover { color: var(--accent); }

    /* Done drawer */
    details.drawer { margin-top: 20px; color: var(--faint); font-size: 13px; }
    details.drawer summary { cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 6px; padding: 4px 2px; user-select: none; }
    details.drawer summary::-webkit-details-marker { display: none; }
    details.drawer summary svg { transition: transform 0.15s ease; }
    details.drawer[open] summary svg { transform: rotate(90deg); }
    details.drawer .cards { margin-top: 8px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }

    /* List */
    .list { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
    .group { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--lane); border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
    .group:first-child { border-top: 0; }
    .group b { color: var(--text); font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .group .act { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
    .group .act i { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
    .group .act[data-a="working"] i { background: var(--accent); }
    .group .act[data-a="waiting"] i { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .group .act[data-a="closed"] i { opacity: 0.4; }
    .group .grow { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; overflow: hidden; }
    .group button.tag { flex: none; }
    .row { display: grid; grid-template-columns: 74px minmax(0, 1fr) 130px 150px 64px 32px; gap: 12px; align-items: center; padding: 9px 14px; border-top: 1px solid var(--line); cursor: pointer; }
    .row:hover { background: var(--accent-soft); }
    .row.sel { background: var(--accent-soft); }
    .row .k { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
    .row .t { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .row .t span.tt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
    .row .t .dot { margin-top: 0; }
    .row .lb { display: flex; gap: 4px; overflow: hidden; }
    .row .when { font-size: 12px; color: var(--faint); text-align: right; font-variant-numeric: tabular-nums; }
    .row.closed .tt { color: var(--muted); }
    .row.closed[data-s="cancelled"] .tt { text-decoration: line-through; }
    .pill { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 999px; font-size: 11.5px; font-weight: 500; background: var(--chip); color: var(--muted); white-space: nowrap; }
    .pill[data-s="waiting_on_user"] { background: var(--accent-soft); color: var(--accent); }
    .pill[data-s="review"] { background: var(--accent-soft); color: var(--accent); }
    .pill[data-s="failed"] { background: var(--danger-soft); color: var(--danger); }
    .pill[data-s="in_progress"] { color: var(--accent); }
    .pill[data-s="done"] { background: var(--ok-soft); color: var(--ok); }
    .listFoot { padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--faint); }

    /* Empty states */
    .empty { color: var(--faint); font-size: 13px; text-align: center; padding: 22px 8px 18px; }
    .empty.big { padding: 34px 8px 30px; }
    .empty.big svg { display: block; margin: 0 auto 10px; color: var(--faint); opacity: 0.8; }
    .empty.big strong { display: block; color: var(--text); font-weight: 500; font-size: 14px; }
    .empty.big span { display: block; margin-top: 2px; }

    /* Panel */
    .scrim { position: fixed; inset: 0; background: rgba(10, 10, 14, 0.18); z-index: 9; }
    aside.panel {
      position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); z-index: 10; background: var(--card);
      box-shadow: var(--shadow-panel); border-left: 1px solid var(--line); display: flex; flex-direction: column;
    }
    .pHead { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
    .pHead .pkey { font-size: 12.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
    .pHead .x { margin-left: auto; border: 0; background: none; width: 30px; height: 30px; border-radius: 8px; color: var(--muted); font-size: 18px; }
    .pHead .x:hover { background: var(--chip); }
    .pBody { flex: 1; overflow-y: auto; padding: 16px 18px 28px; }
    .pTitle { width: 100%; border: 1px solid transparent; border-radius: 8px; background: none; font-size: 18px; font-weight: 600; letter-spacing: -0.012em; padding: 4px 6px; margin: 0 0 10px -7px; resize: none; line-height: 1.3; overflow: hidden; min-height: 0; }
    .pTitle:hover { border-color: var(--line-strong); }
    .pTitle:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .fields { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 7px 12px; align-items: center; font-size: 13px; margin-bottom: 16px; }
    .fields > label, .fields > .lab { color: var(--faint); font-size: 12.5px; }
    .fields select, .fields input {
      width: 100%; max-width: 280px; height: 30px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--card); padding: 0 8px; min-width: 0;
    }
    .fields select:focus, .fields input:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .ctx { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
    .ctx .tag { display: inline-block; line-height: 20px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
    .fields > * { min-width: 0; }
    .sect { margin: 18px 0 8px; font-size: 12px; font-weight: 600; color: var(--faint); text-transform: uppercase; letter-spacing: 0.04em; display: flex; align-items: center; gap: 8px; }
    .sect button { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 500; }
    .md { font-size: 13.5px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.55; }
    .md a { color: var(--accent); }
    .md.empty-body { color: var(--faint); }
    textarea { width: 100%; min-height: 110px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--card); padding: 9px 10px; resize: vertical; line-height: 1.5; }
    .links { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
    .links a { color: var(--accent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .kids { display: flex; flex-direction: column; gap: 2px; }
    .kid { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 7px; cursor: pointer; font-size: 13px; }
    .kid:hover { background: var(--chip); }
    .kid .k { color: var(--faint); font-size: 12px; }
    .kid .tt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .timeline { position: relative; display: flex; flex-direction: column; gap: 12px; padding-left: 18px; }
    .timeline::before { content: ""; position: absolute; left: 4px; top: 6px; bottom: 6px; width: 1px; background: var(--line-strong); }
    .ev { position: relative; font-size: 13px; color: var(--muted); }
    .ev::before { content: ""; position: absolute; left: -18px; top: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--card); border: 1.5px solid var(--line-strong); }
    .ev.comment::before { background: var(--accent); border-color: var(--accent); }
    .ev b { color: var(--text); font-weight: 500; }
    .ev time { color: var(--faint); font-size: 12px; margin-left: 6px; }
    .ev .said { margin-top: 4px; padding: 8px 10px; background: var(--lane); border-radius: 8px; color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; }
    .compose { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
    .compose textarea { min-height: 64px; }
    .compose .acts, .formActs { display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
    .formActs .msg { margin-right: auto; color: var(--danger); font-size: 12.5px; }
    .toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 20; display: flex; align-items: center; gap: 4px 12px; max-width: calc(100vw - 28px); box-shadow: 0 6px 24px rgba(16, 18, 27, 0.18); }
    .toast .tmsg { overflow-wrap: anywhere; }
    .toast .tmsg em { font-style: normal; opacity: 0.72; }
    .toast .undo { flex: none; border: 0; background: color-mix(in srgb, var(--bg) 16%, transparent); color: inherit; font-weight: 600; font-size: 13px; height: 32px; min-width: 32px; padding: 0 12px; margin: -4px -8px -4px 0; border-radius: 6px; }
    .toast .undo:hover { background: color-mix(in srgb, var(--bg) 26%, transparent); }
    .toast .undo:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* One-click done: a round ✓ on every open card and row (on hover with a mouse, always on touch) */
    .doneBtn {
      flex: none; display: inline-grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 50%;
      background: none; color: var(--faint); opacity: 0; transition: opacity 0.12s ease, color 0.12s ease;
    }
    .doneBtn i { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line-strong); background: var(--card); transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease; }
    .doneBtn svg { display: block; }
    .doneBtn:hover, .doneBtn:focus-visible { color: var(--ok); }
    .doneBtn:hover i, .doneBtn:focus-visible i { border-color: var(--ok); background: var(--ok-soft); }
    .doneBtn:active i { background: var(--ok); border-color: var(--ok); color: var(--card); }
    .doneBtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; opacity: 1; }
    .head .doneBtn { margin: -7px -8px -7px -4px; }
    .card:hover .doneBtn, .card:focus-visible .doneBtn, .card:has(:focus-visible) .doneBtn, .card.sel .doneBtn,
    .row:hover .doneBtn, .row:focus-visible .doneBtn, .row:has(:focus-visible) .doneBtn, .row.sel .doneBtn,
    .nrow:hover .doneBtn, .nrow:focus-visible .doneBtn, .nrow:has(:focus-visible) .doneBtn, .nrow.sel .doneBtn { opacity: 1; }
    @media (hover: none), (pointer: coarse) { .doneBtn { opacity: 1; } .pDone kbd { display: none; } }
    @media (prefers-reduced-motion: reduce) { .doneBtn, .doneBtn i { transition: none; } }
    .row .dn, .nrow .dn { display: flex; justify-content: center; }
    .pDone { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px 0 8px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--card); color: var(--muted); font-size: 12.5px; font-weight: 500; }
    .pDone:hover { border-color: var(--ok); color: var(--ok); background: var(--ok-soft); }
    .pDone:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .pDone kbd { font: inherit; font-size: 11px; color: var(--faint); border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 4px; line-height: 16px; }
    .pHead .pDone + .x { margin-left: 0; }
    .pHead .pDone { margin-left: auto; }

    /* 0.3: actors, priority, dependencies, next, feedback, live updates */
    .av { flex: none; display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; font-size: 10.5px; font-weight: 600; color: #fff; background: hsl(var(--h, 230) 52% 52%); letter-spacing: 0; line-height: 1; }
    .av.human { border-radius: 50%; box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.35); }
    .av.agent { border-radius: 6px; }
    .av.subagent { border-radius: 6px; width: 18px; height: 18px; font-size: 9.5px; opacity: 0.9; outline: 1.5px dashed hsl(var(--h, 230) 52% 52%); outline-offset: 1px; background: hsl(var(--h, 230) 45% 60%); }
    .av.system { background: var(--faint); border-radius: 4px; }
    .av.lg { width: 22px; height: 22px; font-size: 11px; }
    .tags .av { margin-left: auto; }
    .tags .av + .age { margin-left: 6px; }
    .who { display: inline-flex; align-items: center; gap: 5px; vertical-align: middle; }
    .who b { font-weight: 500; color: var(--text); }
    .arrow { color: var(--faint); margin: 0 3px; }
    .prio { display: inline-flex; align-items: center; height: 18px; padding: 0 5px; border-radius: 5px; font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; background: var(--chip); color: var(--muted); flex: none; }
    .prio.P0 { background: var(--danger); color: #fff; }
    .prio.P1 { background: var(--danger-soft); color: var(--danger); }
    .prio.P2 { background: var(--accent-soft); color: var(--accent); }
    .head .prio { margin-top: 1px; }
    .tag.blocked { color: var(--danger); background: var(--danger-soft); font-weight: 500; }
    .card.blocked { background: repeating-linear-gradient(-45deg, var(--card), var(--card) 8px, color-mix(in srgb, var(--danger) 4%, var(--card)) 8px, color-mix(in srgb, var(--danger) 4%, var(--card)) 16px); }
    .card.flash, .row.flash { animation: flash 1.6s ease-out; }
    @keyframes flash { 0% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 55%, transparent); } 100% { box-shadow: var(--shadow); } }
    @media (prefers-reduced-motion: reduce) { .card.flash, .row.flash { animation: none; } }
    .card[draggable="true"], .nrow[draggable="true"] { cursor: grab; }
    .dragging { opacity: 0.45; }
    .drop-before { box-shadow: 0 -3px 0 0 var(--accent) !important; }
    .drop-after { box-shadow: 0 3px 0 0 var(--accent) !important; }
    .live.poll i { background: #d8a03a; opacity: 1; }
    .fbBtn { position: relative; }
    .fbBtn .n { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 11px; font-weight: 600; }
    :root[data-theme="dark"] .fbBtn .n { color: #0e0f11; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .fbBtn .n { color: #0e0f11; } }
    .fbBtn .n.zero { background: var(--chip); color: var(--faint); }

    /* Next view */
    .nextHead { display: flex; align-items: baseline; gap: 10px; margin: 2px 2px 10px; color: var(--muted); font-size: 13px; }
    .nextHead h2 { margin: 0; font-size: 15px; color: var(--text); font-weight: 600; }
    .nrow { display: grid; grid-template-columns: 26px 30px minmax(0, 1fr) auto 64px 32px; gap: 10px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); cursor: pointer; background: var(--card); }
    .nrow:first-child { border-top: 0; }
    .nrow:hover, .nrow.sel { background: var(--accent-soft); }
    .nrow .pos { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; text-align: right; }
    .nrow .t { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .nrow .tt { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .nrow .sub { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--faint); overflow: hidden; white-space: nowrap; }
    .nrow .when { font-size: 12px; color: var(--faint); text-align: right; font-variant-numeric: tabular-nums; }
    .nrow .grip { color: var(--faint); font-size: 14px; letter-spacing: -2px; user-select: none; }

    /* Dependencies in the panel */
    .deps { display: flex; flex-direction: column; gap: 2px; }
    .dep { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 7px; font-size: 13px; cursor: pointer; }
    .dep:hover { background: var(--chip); }
    .dep .k { color: var(--faint); font-size: 12px; }
    .dep .tt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dep.closed .tt { color: var(--faint); text-decoration: line-through; }
    .dep .rm { border: 0; background: none; color: var(--faint); width: 22px; height: 22px; border-radius: 6px; font-size: 15px; }
    .dep .rm:hover { background: var(--danger-soft); color: var(--danger); }
    .depAdd { display: flex; gap: 6px; margin-top: 6px; }
    .depAdd input { width: 110px; height: 28px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--card); padding: 0 8px; }
    .depAdd .btn { height: 28px; }
    .depCols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .depCols h4 { margin: 0 0 4px; font-size: 12px; font-weight: 500; color: var(--faint); }
    .ev .who .av { width: 16px; height: 16px; font-size: 9px; }
    .ev.agent::before { background: var(--lane); border-style: dashed; }
    .ev.dependency::before, .ev.unblocked::before { border-color: var(--ok); }
    .ev.unblocked::before { background: var(--ok); }
    .ev.blocked::before { background: var(--danger); border-color: var(--danger); }

    /* Feedback view */
    .fbList .row { grid-template-columns: 74px 92px minmax(0, 1fr) 150px 64px; }
    .ftype { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 8px; border-radius: 999px; font-size: 11.5px; font-weight: 500; background: var(--chip); color: var(--muted); }
    .ftype.bug { background: var(--danger-soft); color: var(--danger); }
    .ftype.suggestion { background: var(--ok-soft); color: var(--ok); }
    .ftype.friction { background: color-mix(in srgb, #d8a03a 16%, transparent); color: #b07a14; }
    .resolve { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 10px; background: var(--lane); margin-bottom: 14px; }
    .resolve textarea { min-height: 54px; }
    .resolve .acts { display: flex; gap: 8px; justify-content: flex-end; }

    @media (max-width: 900px) {
      .nrow { grid-template-columns: 30px minmax(0, 1fr) auto 30px 32px; gap: 8px; padding: 10px 12px; }
      .nrow .pos { display: none; }
      .depCols { grid-template-columns: 1fr; }
      .fbList .row { grid-template-columns: minmax(0, 1fr) auto; }
      .fbList .row .ft { grid-column: 1; grid-row: 2; padding-left: 16px; }
      .seg button { padding: 0 9px; }
      .fbBtn .opt { display: none; }
    }

    /* Auth */
    #auth { max-width: 440px; margin: 12vh auto 0; padding: 0 24px; text-align: center; }
    #auth h2 { font-size: 16px; font-weight: 600; margin: 0 0 6px; }
    #auth p { margin: 0 0 18px; color: var(--muted); }
    #auth form { display: flex; gap: 8px; }
    #tok { flex: 1; min-width: 0; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--card); outline: none; }
    #tok:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

    @media (max-width: 900px) {
      .wrap { padding: 0 14px; }
      .bar { height: auto; padding-top: 10px; padding-bottom: 8px; flex-wrap: wrap; gap: 8px 10px; }
      .search { order: 3; flex-basis: 100%; max-width: none; margin-left: 0; }
      .summary .opt { display: none; }
      .grid, details.drawer .cards { grid-template-columns: minmax(0, 1fr); gap: 14px; }
      details.drawer .cards { gap: 6px; }
      .lane { min-height: 0; }
      .filters { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
      body { overflow-x: hidden; }
      .filters::-webkit-scrollbar { display: none; }
      .filters > * { flex: none; }
      .row { grid-template-columns: minmax(0, 1fr) auto 32px; gap: 4px 10px; }
      .row .dn { grid-column: 3; grid-row: 1 / span 2; align-self: center; }
      .row .k { order: 2; grid-column: 2; grid-row: 1; text-align: right; }
      .row .t { grid-column: 1; grid-row: 1; }
      .row .st { grid-column: 1; grid-row: 2; padding-left: 16px; }
      .row .lb { display: none; }
      .row .when { grid-column: 2; grid-row: 2; }
      .group .hideS { display: none; }
      aside.panel { width: 100vw; border-left: 0; }
      .fields { grid-template-columns: 84px minmax(0, 1fr); }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap bar">
      <div class="brand">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="1.5" y="2.5" width="4.5" height="15" rx="1.6" fill="currentColor"/><rect x="7.75" y="2.5" width="4.5" height="10" rx="1.6" fill="currentColor" opacity=".55"/><rect x="14" y="2.5" width="4.5" height="6.5" rx="1.6" fill="currentColor" opacity=".3"/></svg>
        <span>Board</span>
      </div>
      <label class="search">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.6"/><path d="m11 11 3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input id="q" type="search" placeholder="Search tickets, comments, SB-12…" autocomplete="off" spellcheck="false" aria-label="Search">
      </label>
      <div class="summary">
        <span id="summary"></span>
        <span class="live" id="live" title=""><i></i><span class="opt" id="liveText">Connecting</span></span>
      </div>
      <button class="btn fbBtn" type="button" data-view="feedback" id="fbBtn" title="Feedback inbox: bugs, suggestions and frictions reported by sessions">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
        <span class="opt">Feedback</span><span class="n zero" id="fbCount">0</span>
      </button>
      <button class="btn primary" type="button" data-act="new">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.5v9M1.5 6h9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <span>New</span>
      </button>
    </div>
    <div class="wrap filters" id="filters"></div>
  </header>

  <section id="auth" hidden>
    <h2>Access token needed</h2>
    <p>Paste the board token once; it stays in this browser.</p>
    <form id="authForm">
      <input id="tok" type="password" placeholder="Token" autocomplete="off" spellcheck="false">
      <button class="btn primary" type="submit">Open board</button>
    </form>
  </section>

  <main class="wrap" id="main">
    <div id="boardView">
      <div class="grid">
        <section class="lane primary" aria-labelledby="h-waiting">
          <div class="laneHead"><h2 id="h-waiting">Waiting on you</h2><span class="count" id="n-waiting"></span></div>
          <div class="cards" id="col-waiting"></div>
        </section>
        <section class="lane" aria-labelledby="h-progress">
          <div class="laneHead"><h2 id="h-progress">In progress</h2><span class="count" id="n-inProgress"></span></div>
          <div class="cards" id="col-inProgress"></div>
        </section>
        <section class="lane" aria-labelledby="h-todo">
          <div class="laneHead"><h2 id="h-todo">To do</h2><span class="count" id="n-todo"></span></div>
          <div class="cards" id="col-todo"></div>
        </section>
      </div>
      <details class="drawer" id="doneBox" hidden>
        <summary><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M3 1.5 6.5 5 3 8.5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="doneLabel"></span></summary>
        <div class="cards" id="col-done"></div>
      </details>
    </div>
    <div id="listView" hidden></div>
    <div id="nextView" hidden></div>
    <div id="feedbackView" hidden></div>
  </main>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="panel" id="panel" hidden aria-label="Ticket"></aside>

  <script>
    (() => {
      const KEY = 'session-board-token';
      const root = document.documentElement;
      const $ = (id) => document.getElementById(id);
      const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
      const httpsUrl = (u) => (typeof u === 'string' && /^https:\/\//.test(u) ? u : null);

      const hash = location.hash.match(/token=([^&]+)/);
      if (hash) {
        localStorage.setItem(KEY, decodeURIComponent(hash[1]));
        history.replaceState(null, '', location.pathname + location.search);
      }
      const headers = (json) => {
        const t = localStorage.getItem(KEY);
        return { ...(t ? { authorization: 'Bearer ' + t } : {}), ...(json ? { 'content-type': 'application/json' } : {}) };
      };
      // Relative paths only: the page works under any sub-path (e.g. /session-board/).
      async function api(path, body) {
        const res = await fetch('api/' + path, body ? { method: 'POST', headers: headers(true), body: JSON.stringify(body), cache: 'no-store' } : { headers: headers(), cache: 'no-store' });
        if (res.status === 401) { locked(); throw new Error('locked'); }
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'HTTP ' + res.status);
        return data;
      }

      // ---- state: everything that matters lives in the URL ------------------------------------
      const FILTERS = ['repo', 'session', 'actor', 'status', 'priority', 'assignee', 'kind', 'subtype', 'label', 'origin', 'machine', 'branch'];
      const VIEWS = ['board', 'next', 'list', 'feedback'];
      let state = readUrl();
      function readUrl() {
        const p = new URLSearchParams(location.search);
        const s = { q: p.get('q') || '', view: VIEWS.includes(p.get('view')) ? p.get('view') : 'board', ticket: p.get('ticket') || '', archived: p.get('archived') === '1', f: {} };
        for (const k of FILTERS) if (p.get(k)) s.f[k] = p.get(k);
        const theme = p.get('theme');
        if (theme === 'light' || theme === 'dark') root.dataset.theme = theme;
        return s;
      }
      function writeUrl(push) {
        const p = new URLSearchParams();
        if (state.q) p.set('q', state.q);
        for (const k of FILTERS) if (state.f[k]) p.set(k, state.f[k]);
        if (state.view !== 'board') p.set('view', state.view);
        if (state.archived) p.set('archived', '1');
        if (state.ticket) p.set('ticket', state.ticket);
        const theme = new URLSearchParams(location.search).get('theme');
        if (theme) p.set('theme', theme);
        const url = location.pathname + (p.toString() ? '?' + p : '');
        if (url === location.pathname + location.search) return;
        (push ? history.pushState : history.replaceState).call(history, null, '', url);
      }
      function query(extra = {}) {
        const p = new URLSearchParams();
        if (state.q) p.set('q', state.q);
        for (const k of FILTERS) if (state.f[k]) p.set(k, state.f[k]);
        if (state.archived) p.set('archived', '1');
        if (state.view === 'feedback') p.set('kind', 'feedback');
        for (const [k, v] of Object.entries(extra)) p.set(k, v);
        return p.toString() ? '?' + p : '';
      }
      function setFilter(k, v) {
        if (v) state.f[k] = v; else delete state.f[k];
        listLimit = 100;
        writeUrl(true);
        renderFilters();
        refresh();
      }

      // ---- formatting ---------------------------------------------------------------------------
      function ago(ms, now) {
        const s = Math.max(0, Math.round((now - ms) / 1000));
        if (s < 45) return 'now';
        const m = Math.round(s / 60);
        if (m < 60) return `${m}m`;
        const h = Math.round(m / 60);
        if (h < 24) return `${h}h`;
        const d = Math.round(h / 24);
        return d < 45 ? `${d}d` : new Date(ms).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
      }
      const when = (ms) => new Date(ms).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      const repoName = (r) => (r ? r.split('/').pop() : '');
      const STATUS = { todo: 'To do', in_progress: 'In progress', waiting_on_user: 'Waiting on you', review: 'Review', done: 'Done', cancelled: 'Cancelled', failed: 'Failed' };
      const ACT = { working: 'working', waiting: 'needs you', idle: 'idle', closed: 'closed' };
      const sessionName = (t) => t.session?.title || (t.session_id ? 'Session ' + t.session_id.slice(0, 6) : '');

      // ---- actors: who did what, to whom ------------------------------------------------------
      const actors = new Map([
        ['user', { id: 'user', type: 'human', name: 'You' }],
        ['claude', { id: 'claude', type: 'agent', name: 'Claude' }],
        ['hook', { id: 'hook', type: 'system', name: 'Session' }],
      ]);
      function learnActors(list) {
        for (const a of Object.values(list || {})) if (a && a.id) actors.set(a.id, { ...actors.get(a.id), ...a, name: a.id === 'user' ? 'You' : a.name || a.id });
      }
      function actor(id) {
        if (actors.has(id)) return actors.get(id);
        const sub = String(id || '').includes('/');
        return { id, type: sub ? 'subagent' : 'agent', name: sub ? String(id).split('/').pop() : String(id || '?') };
      }
      const actorName = (id) => actor(id).name;
      function hue(id) {
        if (id === 'user') return 152;
        if (id === 'claude') return 18;
        let h = 0;
        for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) % 360;
        return h;
      }
      function initials(a) {
        const n = String(a.name || a.id || '?').replace(/[^\p{L}\p{N} ]/gu, ' ').trim();
        const parts = n.split(/\s+/).filter(Boolean);
        return (parts.length > 1 ? parts[0][0] + parts[1][0] : n.slice(0, a.type === 'subagent' ? 2 : 1)).toUpperCase() || '?';
      }
      function avatar(id, extra = '') {
        const a = actor(id);
        const title = `${a.name}${a.type === 'subagent' ? ' (subagent' + (a.parent ? ' of ' + actorName(a.parent) : '') + ')' : a.type === 'human' ? '' : ' (' + a.type + ')'}`;
        return `<span class="av ${esc(a.type)} ${extra}" style="--h:${hue(id)}" title="${esc(title)}">${esc(initials(a))}</span>`;
      }
      const who = (id) => `<span class="who">${avatar(id)}<b>${esc(actorName(id))}</b></span>`;
      const PRIO = { P0: 'P0 · now', P1: 'P1 · next', P2: 'P2 · normal', P3: 'P3 · later' };
      const prio = (p) => (p ? `<span class="prio ${esc(p)}" title="Priority ${esc(PRIO[p] || p)}">${esc(p)}</span>` : '');
      const FTYPE = { bug: 'Bug', suggestion: 'Suggestion', friction: 'Friction' };

      // ---- markdown ---------------------------------------------------------------------------
      // Two modes:
      //  - plain() for previews (cards, rows, titles): strips markdown markers so you never see "###".
      //  - md() for the detail panel + history: renders a safe subset of Markdown (no HTML allowed).
      const plain = (s) => {
        const lines = String(s || '').replace(/\r\n/g, '\n').split('\n');
        const out = [];
        let inFence = false;
        for (let l of lines) {
          const t = l.trimEnd();
          if (/^```/.test(t)) { inFence = !inFence; continue; }
          if (inFence) continue;
          l = t;
          // Headings, blockquotes, list markers.
          l = l.replace(/^\s*#{1,6}\s+/, '');
          l = l.replace(/^\s*>\s?/, '');
          l = l.replace(/^\s*(?:[-*+]\s+|\d+\.\s+)/, '');
          // Links: [label](url) -> label
          l = l.replace(/\[([^\]]+)\]\([^)]*\)/g, '$1');
          // Inline markers.
          l = l.replace(/[*_~`]/g, '');
          l = l.replace(/\s+/g, ' ').trim();
          if (l) out.push(l);
        }
        return out.join(' ').trim();
      };

      const safeUrl = (u) => {
        const s = String(u || '').trim();
        if (/^https?:\/\//i.test(s) || /^mailto:/i.test(s)) return s;
        return null;
      };

      function inlineHtml(raw) {
        // Markdown links first, on the raw string: [label](url)
        const links = [];
        let s = String(raw || '').replace(/\[([^\]]{1,200})\]\(([^)\s]{1,400})\)/g, (_, label, url) => {
          const ok = safeUrl(url);
          const html = ok ? `<a href="${esc(ok)}" target="_blank" rel="noopener">${esc(label)}</a>` : esc(label);
          links.push(html);
          return `\u0000L${links.length - 1}\u0000`;
        });
        // Escape everything else.
        s = esc(s);
        // Restore links.
        s = s.replace(/\u0000L(\d+)\u0000/g, (_, i) => links[Number(i)] || '');
        // Inline code.
        s = s.replace(/`([^`\n]{1,200})`/g, '<code>$1</code>');
        // Bold + italic.
        s = s.replace(/\*\*([^*\n]{1,200})\*\*/g, '<strong>$1</strong>');
        s = s.replace(/(^|[\s(])_([^_\n]{1,200})_([\s).,!?;:]|$)/g, '$1<em>$2</em>$3');
        s = s.replace(/(^|[\s(])\*([^*\n]{1,200})\*([\s).,!?;:]|$)/g, '$1<em>$2</em>$3');
        // Autolink http(s) URLs.
        s = s.replace(/\b(https?:\/\/[^\s<]{3,300})/g, (m) => {
          const ok = safeUrl(m);
          return ok ? `<a href="${esc(ok)}" target="_blank" rel="noopener">${esc(ok)}</a>` : esc(m);
        });
        // Autolink plain emails.
        s = s.replace(/\b([A-Z0-9._%+-]{1,64}@[A-Z0-9.-]{1,120}\.[A-Z]{2,20})\b/gi, (m) => `<a href="mailto:${esc(m)}">${esc(m)}</a>`);
        return s;
      }

      /** Safe markdown subset: headings, lists, blockquotes, code blocks, tables, links, bold/italic/code. */
      function md(s) {
        const lines = String(s || '').replace(/\r\n/g, '\n').split('\n');
        const out = [];
        let i = 0;

        const flushPara = (buf) => {
          const text = buf.map((x) => inlineHtml(x)).join('<br>');
          out.push(text ? `<p>${text}</p>` : '');
        };

        while (i < lines.length) {
          let l = lines[i];

          // Fenced code block.
          const fence = l.match(/^```([A-Za-z0-9_-]{0,20})\s*$/);
          if (fence) {
            const code = [];
            i++;
            while (i < lines.length && !/^```/.test(lines[i])) { code.push(lines[i]); i++; }
            if (i < lines.length) i++;
            out.push(`<pre><code>${esc(code.join('\n'))}</code></pre>`);
            continue;
          }

          // Blank.
          if (!l.trim()) { i++; continue; }

          // Table: header line with |, then --- separator.
          if (l.includes('|') && i + 1 < lines.length && /^\s*\|?\s*:?[-]{3,}\s*:?\s*(\|\s*:?[-]{3,}\s*:?\s*)+\|?\s*$/.test(lines[i + 1])) {
            const head = l.trim().replace(/^\||\|$/g, '');
            const cols = head.split('|').map((c) => c.trim());
            i += 2;
            const rows = [];
            while (i < lines.length && lines[i].includes('|') && lines[i].trim()) {
              const cells = lines[i].trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
              rows.push(cells);
              i++;
            }
            out.push(
              `<table><thead><tr>${cols.map((c) => `<th>${inlineHtml(c)}</th>`).join('')}</tr></thead>` +
              `<tbody>${rows.map((r) => `<tr>${cols.map((_, j) => `<td>${inlineHtml(r[j] || '')}</td>`).join('')}</tr>`).join('')}</tbody></table>`,
            );
            continue;
          }

          // Heading.
          const h = l.match(/^(#{1,6})\s+(.*)$/);
          if (h) {
            const n = h[1].length;
            out.push(`<h${n}>${inlineHtml(h[2])}</h${n}>`);
            i++;
            continue;
          }

          // Blockquote.
          if (/^\s*>\s?/.test(l)) {
            const q = [];
            while (i < lines.length && /^\s*>\s?/.test(lines[i])) {
              q.push(lines[i].replace(/^\s*>\s?/, ''));
              i++;
            }
            out.push(`<blockquote>${q.map((x) => inlineHtml(x)).join('<br>')}</blockquote>`);
            continue;
          }

          // Lists.
          const bullet = l.match(/^\s*([-*+])\s+(.*)$/);
          const ordered = l.match(/^\s*(\d+)\.\s+(.*)$/);
          if (bullet || ordered) {
            const tag = ordered ? 'ol' : 'ul';
            const items = [];
            while (i < lines.length) {
              const b = lines[i].match(/^\s*([-*+])\s+(.*)$/);
              const o = lines[i].match(/^\s*(\d+)\.\s+(.*)$/);
              if (tag === 'ul' && !b) break;
              if (tag === 'ol' && !o) break;
              items.push(inlineHtml((b ? b[2] : o[2]) || ''));
              i++;
            }
            out.push(`<${tag}>${items.map((x) => `<li>${x}</li>`).join('')}</${tag}>`);
            continue;
          }

          // Paragraph: gather until blank or next block.
          const para = [];
          while (i < lines.length && lines[i].trim() &&
            !/^```/.test(lines[i]) &&
            !/^(#{1,6})\s+/.test(lines[i]) &&
            !/^\s*>\s?/.test(lines[i]) &&
            !/^\s*([-*+])\s+/.test(lines[i]) &&
            !/^\s*(\d+)\.\s+/.test(lines[i])
          ) {
            para.push(lines[i]);
            i++;
          }
          flushPara(para);
        }

        return out.join('');
      }

      /** One line that says what a ticket needs from you. */
      function reason(t) {
        const d = String(t.body || '').trim();
        if (t.status === 'failed') {
          const last = d || 'the last turn errored';
          return `<span class="k">Failed</span>${esc(plain(last))}`;
        }
        if (t.kind === 'permission') return '<span class="k">Approve</span>in the session';
        if (t.kind === 'question' && t.source === 'hook') return '<span class="k">Question</span>answer in the session';
        if (t.status === 'review') return d ? `<span class="k">Review</span>${esc(plain(d))}` : '<span class="k">Review</span>the turn ended';
        if (t.status === 'waiting_on_user' && d) return esc(plain(d));
        return '';
      }

      function tags(t, now, opts = {}) {
        const out = [];
        if (t.repo && !state.f.repo) out.push(`<button type="button" class="tag" data-filter="repo" data-value="${esc(t.repo)}" title="Filter on ${esc(t.repo)}">${esc(repoName(t.repo))}${t.branch && t.branch !== 'HEAD' && t.branch !== 'main' && t.branch !== 'master' ? ' · ' + esc(t.branch) : ''}</button>`);
        if (t.session_id && !state.f.session && !opts.noSession && t.kind !== 'session') out.push(`<button type="button" class="tag sess" data-filter="session" data-value="${esc(t.session_id)}" title="Session: ${esc(sessionName(t))}">${t.origin === 'cloud' ? '☁ ' : '› '}${esc(sessionName(t))}</button>`);
        if (t.blocked) {
          const open = (t.blocked_by || []).filter((b) => b.status !== 'done' && b.status !== 'cancelled');
          out.push(`<span class="tag blocked" title="Blocked by ${esc(open.map((b) => b.key + ' ' + b.title).join(', '))}">⛔ ${esc(open.map((b) => b.key).join(', ') || 'blocked')}</span>`);
        }
        if (!t.blocked && t.blocking?.some((b) => b.status !== 'done' && b.status !== 'cancelled')) out.push(`<span class="tag" title="Blocks ${esc(t.blocking.map((b) => b.key).join(', '))}">blocks ${t.blocking.filter((b) => b.status !== 'done' && b.status !== 'cancelled').length}</span>`);
        for (const l of t.labels || []) out.push(`<button type="button" class="tag lbl" data-filter="label" data-value="${esc(l)}">#${esc(l)}</button>`);
        const pr = (t.links || []).find((l) => l.type === 'pr' && httpsUrl(l.url));
        if (pr) out.push(`<a class="tag" href="${esc(pr.url)}" target="_blank" rel="noopener" data-stop="1">PR #${esc((pr.url.match(/(\d+)$/) || [])[1] || '')} ↗</a>`);
        if (t.children_count) out.push(`<span class="tag" title="Sub-tickets">↳ ${t.children_count}</span>`);
        if (t.comments_count) out.push(`<span class="tag" title="Comments">💬 ${t.comments_count}</span>`);
        if (!opts.noAvatar && t.assignee) out.push(avatar(t.assignee));
        out.push(`<span class="age" title="${esc(when(t.status_at))}${t.created_by && t.created_by !== t.assignee ? ' · opened by ' + esc(actorName(t.created_by)) : ''}">${ago(t.status_at, now)}</span>`);
        return out.join('');
      }

      const isOpen = (t) => t.status !== 'done' && t.status !== 'cancelled';
      const CHECK = '<svg width="11" height="11" viewBox="0 0 12 12" aria-hidden="true"><path d="m2.4 6.3 2.4 2.4 4.8-5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      /** The one-click ✓ of an open ticket; `data-from` keeps the status Undo goes back to. */
      const doneBtn = (t) => (isOpen(t) ? `<button type="button" class="doneBtn" data-done="${esc(t.key)}" data-from="${esc(t.status)}" aria-label="Mark ${esc(t.key)} as done" title="Mark done (d)"><i>${CHECK}</i></button>` : '');

      function card(t, now) {
        const r = t.column === 'waiting' ? reason(t) : '';
        let note = '';
        if (!r && t.stale) note = 'No activity for a while';
        else if (!r && t.status === 'in_progress' && t.kind === 'session' && t.session?.activity === 'waiting') note = 'Waiting for you in the session';
        else if (!r && t.body && t.column !== 'done') note = esc(plain(t.body));
        const live = t.status === 'in_progress' && t.kind === 'session' && t.session?.activity === 'working' ? '1' : '0';
        const drag = t.column === 'todo' ? ' draggable="true"' : '';
        return `<article class="card${t.stale || t.status === 'cancelled' ? ' dim' : ''}${t.blocked ? ' blocked' : ''}${state.ticket === t.key ? ' sel' : ''}" data-open="${esc(t.key)}" data-status="${esc(t.status)}" data-live="${live}" tabindex="0"${drag}>
          <div class="head"><span class="dot"></span><h3 class="title">${esc(t.title)}</h3>${prio(t.priority)}<span class="key">${esc(t.key)}</span>${doneBtn(t)}</div>
          ${r ? `<div class="reason">${r}</div>` : ''}${note ? `<div class="note">${note}</div>` : ''}
          <div class="tags">${tags(t, now)}</div>
        </article>`;
      }

      const EMPTY_WAITING = '<div class="empty big"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9.25" stroke="currentColor" stroke-width="1.5"/><path d="m8 12.3 2.6 2.6L16 9.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><strong>Nothing waiting on you</strong><span>Questions, approvals and reviews show up here.</span></div>';
      const EMPTY = (t) => `<div class="empty">${t}</div>`;
      const setHtml = (el, html) => { if (el.__html !== html) { el.innerHTML = html; el.__html = html; el.__nodes = null; el.__sig = null; } };
      /**
       * Keyed update of a list of cards or rows: unchanged nodes stay in place (no flicker, hover and
       * focus kept), changed ones are swapped, and the ones a live change touched flash once.
       */
      let changedKeys = new Set();
      function reconcile(el, items, { empty = '', tail = '' } = {}) {
        const sig = items.map((i) => i.html).join('\u0001') + '\u0002' + tail;
        if (el.__sig === sig) return;
        el.__sig = sig;
        el.__html = null;
        if (!items.length) {
          el.innerHTML = empty;
          el.__nodes = null;
          return;
        }
        const old = el.__nodes || new Map();
        const next = new Map();
        const nodes = [];
        for (const it of items) {
          let node = old.get(it.key);
          if (!node || node.__html !== it.html) {
            const tpl = document.createElement('template');
            tpl.innerHTML = it.html.trim();
            const fresh = tpl.content.firstElementChild;
            fresh.__html = it.html;
            if (changedKeys.has(it.key)) fresh.classList.add('flash');
            node = fresh;
          }
          next.set(it.key, node);
          nodes.push(node);
        }
        if (tail) {
          const tpl = document.createElement('template');
          tpl.innerHTML = tail.trim();
          nodes.push(...tpl.content.childNodes);
        }
        el.replaceChildren(...nodes);
        el.__nodes = next;
      }

      // ---- filter bar ---------------------------------------------------------------------------
      let facets = { repos: [], sessions: [], labels: [], machines: [], kinds: [], branches: [] };
      function chipLabel(k, v) {
        if (k === 'session') {
          const s = facets.sessions.find((x) => x.id === v);
          return s ? (s.title || 'Session ' + v.slice(0, 6)) : 'Session ' + v.slice(0, 8);
        }
        if (k === 'status') return v.split(',').map((x) => STATUS[x] || x).join(', ');
        if (k === 'assignee') return v === 'user' ? 'Assigned to you' : 'Assigned to ' + actorName(v);
        if (k === 'actor') return actorName(v);
        if (k === 'priority') return v.split(',').join(', ');
        if (k === 'subtype') return v.split(',').map((x) => FTYPE[x] || x).join(', ');
        if (k === 'label') return '#' + v;
        return v;
      }
      function options(k) {
        const o = (v, label, n) => `<option value="${esc(v)}">${esc(label)}${n ? ' · ' + n : ''}</option>`;
        if (k === 'repo') return facets.repos.map((r) => o(r.value, repoName(r.value) + (facets.repos.filter((x) => repoName(x.value) === repoName(r.value)).length > 1 ? ' (' + r.value + ')' : ''), r.open || ''));
        if (k === 'session') return facets.sessions.filter((s) => !state.f.repo || s.repo === state.f.repo || repoName(s.repo) === state.f.repo).slice(0, 80).map((s) => o(s.id, `${s.title || 'Session ' + s.id.slice(0, 6)}${s.repo ? ' — ' + repoName(s.repo) : ''}`, s.open || ''));
        if (k === 'status') return [['open', 'Open'], ['todo', 'To do'], ['in_progress', 'In progress'], ['waiting_on_user', 'Waiting on you'], ['review', 'Review'], ['failed', 'Failed'], ['done', 'Done'], ['cancelled', 'Cancelled']].map(([v, l]) => o(v, l));
        if (k === 'assignee') return [o('user', 'You'), ...(facets.actors || []).filter((a) => a.id !== 'user' && a.type !== 'system').map((a) => o(a.id, a.name, a.open || ''))];
        if (k === 'actor') return (facets.actors || []).filter((a) => a.type !== 'system').map((a) => o(a.id, (a.type === 'subagent' ? '↳ ' : '') + (a.id === 'user' ? 'You' : a.name), a.open || ''));
        if (k === 'priority') return [o('P0', 'P0 · now'), o('P1', 'P1 · next'), o('P2', 'P2 · normal'), o('P3', 'P3 · later'), o('none', 'No priority')];
        if (k === 'subtype') return [o('bug', 'Bug'), o('suggestion', 'Suggestion'), o('friction', 'Friction')];
        if (k === 'label') return facets.labels.map((l) => o(l.value, '#' + l.value, l.total));
        if (k === 'kind') return facets.kinds.map((x) => o(x.value, x.value, x.open || ''));
        if (k === 'origin') return [o('terminal', 'Terminal'), o('cloud', 'Cloud')];
        if (k === 'machine') return facets.machines.map((x) => o(x.value, x.value, x.open || ''));
        return [];
      }
      const PICK_LABEL = { repo: 'Repo', session: 'Session', actor: 'Actor', priority: 'Priority', status: 'Status', assignee: 'Assignee', subtype: 'Type', label: 'Label', kind: 'Kind', origin: 'Origin', machine: 'Machine' };
      function renderFilters() {
        const seg = [['board', 'Board'], ['next', 'Next'], ['list', 'List']].map(([v, l]) => `<button type="button" data-view="${v}" aria-pressed="${state.view === v}">${l}</button>`).join('');
        const parts = [`<div class="seg" role="group" aria-label="View">${seg}${state.view === 'feedback' ? '<button type="button" data-view="feedback" aria-pressed="true">Feedback</button>' : ''}</div>`];
        for (const k of FILTERS) {
          if (!state.f[k]) continue;
          parts.push(`<span class="chip"><span><em>${esc(PICK_LABEL[k] || k)}</em> ${esc(chipLabel(k, state.f[k]))}</span><button type="button" data-unfilter="${k}" aria-label="Remove filter">×</button></span>`);
        }
        for (const k of Object.keys(PICK_LABEL)) {
          if (state.f[k]) continue;
          if (k === 'subtype' && state.view !== 'feedback') continue;
          if (k === 'kind' && state.view === 'feedback') continue;
          const opts = options(k);
          if (!opts.length || (k === 'machine' && opts.length < 2) || (k === 'origin' && !facets.hasCloud) || (k === 'actor' && opts.length < 2)) continue;
          parts.push(`<span class="pick"><select data-pick="${k}" aria-label="Filter by ${esc(PICK_LABEL[k])}"><option value="">${esc(PICK_LABEL[k])}</option>${opts.join('')}</select></span>`);
        }
        if (Object.keys(state.f).length || state.q) parts.push('<button type="button" class="clear" data-act="clear">Clear</button>');
        parts.push('<span class="spacer"></span>');
        parts.push(`<button type="button" class="clear" data-act="archived" title="Done and cancelled tickets closed more than 30 days ago">${state.archived ? 'Hide archived' : 'Show archived'}</button>`);
        setHtml($('filters'), parts.join(''));
        $('fbBtn').setAttribute('aria-pressed', String(state.view === 'feedback'));
      }

      // ---- board / list -------------------------------------------------------------------------
      let listLimit = 100;
      let lastBoard = null;
      let refreshing = null;
      let refreshAgain = false;
      /** One refresh at a time; a refresh asked for during one runs right after it. */
      async function refresh() {
        if (refreshing) {
          refreshAgain = true;
          return refreshing;
        }
        refreshing = (async () => {
          let data;
          const view = state.view;
          try {
            if (view === 'list') data = await api('tickets' + query({ limit: listLimit, sort: 'updated' }));
            else if (view === 'next') data = await api('tickets/next' + query({ limit: 100 }));
            else if (view === 'feedback') data = await api('tickets' + query({ limit: 300, sort: 'updated', archived: '1' }));
            else data = await api('tickets/board' + query());
          } catch (e) {
            if (e.message !== 'locked') live('off', 'Offline');
            return;
          }
          $('auth').hidden = true;
          $('main').hidden = false;
          const now = data.now ?? Date.now();
          for (const id of ['boardView', 'listView', 'nextView', 'feedbackView']) $(id).hidden = id !== view + 'View';
          if (view === 'list') renderList(data, now);
          else if (view === 'next') renderNext(data, now);
          else if (view === 'feedback') renderFeedback(data, now);
          else renderBoard(data, now);
          changedKeys = new Set();
          lastRefresh = Date.now();
          if (!streamOn) live('poll', 'Polling');
        })();
        try {
          await refreshing;
        } finally {
          refreshing = null;
          if (refreshAgain) {
            refreshAgain = false;
            refresh();
          }
        }
      }

      function renderBoard(b, now) {
        lastBoard = b;
        const c = b.counts || {};
        const col = (name, empty) => {
          const list = b.columns?.[name] || [];
          const more = (c[name] || 0) - list.length;
          reconcile($('col-' + name), list.map((t) => ({ key: t.key, html: card(t, now) })), { empty, tail: more > 0 ? `<div class="more">+ ${more} more — use the list view</div>` : '' });
          if (name !== 'done') $('n-' + name).textContent = String(c[name] || 0);
        };
        col('waiting', EMPTY_WAITING);
        col('inProgress', EMPTY('Nothing in progress'));
        col('todo', EMPTY('Nothing to do'));
        col('done', '');
        $('n-waiting').classList.toggle('hot', (c.waiting || 0) > 0);
        $('doneBox').hidden = !c.done;
        $('doneLabel').textContent = `${c.done || 0} done`;
        summary(c);
      }

      function nextRow(t, i, now) {
        const sub = [];
        if (t.repo && !state.f.repo) sub.push(`<span>${esc(repoName(t.repo))}</span>`);
        if (t.status === 'in_progress') sub.push('<span class="pill" data-s="in_progress">In progress</span>');
        if (t.blocking?.length) sub.push(`<span title="Blocks ${esc(t.blocking.map((b) => b.key).join(', '))}">unblocks ${t.blocking.length}</span>`);
        for (const l of (t.labels || []).slice(0, 3)) sub.push(`<span>#${esc(l)}</span>`);
        sub.push(`<span>${esc(t.key)}</span>`);
        return `<div class="nrow${state.ticket === t.key ? ' sel' : ''}" data-open="${esc(t.key)}" data-s="${esc(t.status)}" draggable="true" tabindex="0">
          <span class="pos">${i + 1}</span>
          <span>${prio(t.priority) || '<span class="prio">–</span>'}</span>
          <span class="t"><span class="tt" title="${esc(t.title)}">${esc(t.title)}</span><span class="sub">${sub.join('<span>·</span>')}</span></span>
          <span>${avatar(t.assignee)}</span>
          <span class="when" title="Created ${esc(when(t.created_at))}">${ago(t.created_at, now)}</span>
          <span class="dn">${doneBtn(t)}</span>
        </div>`;
      }
      function renderNext(r, now) {
        const head = `<div class="nextHead"><h2>Next</h2><span>${r.total} ready${r.blocked ? ` · ${r.blocked} blocked` : ''} · priority, then your order (drag to reorder), then the oldest</span></div>`;
        if (!r.tickets.length) {
          setHtml($('nextView'), head + `<div class="list"><div class="empty big"><strong>Nothing ready</strong><span>${r.blocked ? r.blocked + ' ticket(s) wait for a blocker.' : 'Open, unblocked tickets show up here.'}</span></div></div>`);
          return;
        }
        let box = $('nextView').querySelector('#nextList');
        if (!box) {
          setHtml($('nextView'), head + '<div class="list" id="nextList"></div>');
          box = $('nextView').querySelector('#nextList');
        } else $('nextView').querySelector('.nextHead').outerHTML = head;
        reconcile(box, r.tickets.map((t, i) => ({ key: t.key, html: nextRow(t, i, now) })), { tail: r.total > r.tickets.length ? `<div class="listFoot"><span>${r.total - r.tickets.length} more</span></div>` : '' });
        summaryFromApi();
      }
      function renderFeedback(r, now) {
        const open = r.tickets.filter((t) => t.status !== 'done' && t.status !== 'cancelled');
        const closed = r.tickets.filter((t) => t.status === 'done' || t.status === 'cancelled');
        const row = (t) => `<div class="row${t.status === 'done' || t.status === 'cancelled' ? ' closed' : ''}${state.ticket === t.key ? ' sel' : ''}" data-open="${esc(t.key)}" data-s="${esc(t.status)}" tabindex="0">
              <span class="k">${esc(t.key)}</span>
              <span class="ft"><span class="ftype ${esc(t.subtype || 'suggestion')}">${esc(FTYPE[t.subtype] || 'Suggestion')}</span></span>

              <span class="lb">${avatar(t.created_by || 'claude')}<span class="tag">${esc(actorName(t.created_by || 'claude'))}</span>${t.repo ? `<span class="tag">${esc(repoName(t.repo))}</span>` : ''}</span>
              <span class="when" title="${esc(when(t.created_at))}">${ago(t.created_at, now)}</span>

        const html = [];
        html.push(`<div class="nextHead"><h2>Feedback</h2><span>${open.length} to handle · ${closed.length} handled · reported by sessions with <code>board_feedback</code></span></div>`);
        if (!r.tickets.length) {
          html.push('<div class="list fbList"><div class="empty big"><strong>No feedback yet</strong><span>Sessions report bugs, suggestions and frictions here.</span></div></div>');
        } else {
          html.push('<div class="list fbList">');
          html.push(`<div class="group"><span class="grow"><b>To handle</b></span><span>${open.length}</span></div>`);
          html.push(open.length ? open.map(row).join('') : '<div class="empty">Inbox zero.</div>');
          if (closed.length) html.push(`<div class="group"><span class="grow"><b>Handled</b></span><span>${closed.length}</span></div>`, closed.map(row).join(''));
          html.push('</div>');
        }
        setHtml($('feedbackView'), html.join(''));
        summaryFromApi();
      }

      function renderList(r, now) {
        if (!r.tickets.length) {
          setHtml($('listView'), `<div class="list">${EMPTY_WAITING.replace('Nothing waiting on you', 'No tickets match').replace('Questions, approvals and reviews show up here.', 'Try another filter or search.')}</div>`);
          return;
        }
        // Group by session (a session is a context, its header filters on it); tickets outside sessions last.
        const groups = new Map();
        for (const t of r.tickets) {
          const k = t.session_id || '';
          if (!groups.has(k)) groups.set(k, []);
          groups.get(k).push(t);

              <span class="k">${esc(t.key)}</span>
              <span class="t"><span class="dot" data-s="${esc(t.status)}"></span><span class="tt" title="${esc(t.title)}">${esc(t.title)}</span></span>
              <span class="st"><span class="pill" data-s="${esc(t.status)}">${esc(STATUS[t.status] || t.status)}</span></span>
