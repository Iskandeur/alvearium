# session-board server. Secrets never live in this file:
#   echo "$(openssl rand -hex 32)" > token && chmod 600 token
#   docker compose up -d --build
# Variables (all optional, put them in .env next to this file):
#   SB_TOKEN_FILE  path of the token file on the host        (default ./token)
#   SB_DATA_DIR    where board.json is kept                    (default ./data)
#   SB_UID/SB_GID  user the container runs as (must read the token, write the data dir)
# Agent tokens (optional, README "Agent tokens"): one `<actor> <token>` per line in
#   $SB_DATA_DIR/agent-tokens, then `docker compose restart`.
#   SB_BIND/SB_PORT published address                          (default 127.0.0.1:8793)
#   BOARD_KEY_PREFIX ticket keys (default ALV; a board from before 0.5.3 keeps SB until you set it)
# Put it behind HTTPS (reverse proxy or tunnel) before pointing cloud sessions at it.
services:
  session-board:
    build: .
    image: session-board:local
    container_name: session-board
    restart: unless-stopped
    user: "${SB_UID:-1000}:${SB_GID:-1000}"
    environment:
      SESSION_BOARD_TOKEN_FILE: /run/session-board/token
      SESSION_BOARD_DATA: /data
      BOARD_KEY_PREFIX: ${BOARD_KEY_PREFIX:-}
    volumes:
      - ${SB_TOKEN_FILE:-./token}:/run/session-board/token:ro
      - ${SB_DATA_DIR:-./data}:/data
    ports:
      - "${SB_BIND:-127.0.0.1}:${SB_PORT:-8793}:8793"
