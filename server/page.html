        setHtml($('listView'), `<div class="list">${html.join('')}</div>`);
        summaryFromApi();
      }

      let lastCounts = null;
      async function summaryFromApi() {
        try { summary((await api('tickets/board' + query(state.view === 'feedback' ? { limit: 1, kind: '' } : { limit: 1 }))).counts); } catch {}
      }
      function summary(c) {
        lastCounts = c;
        const nW = c.waiting || 0, nP = c.inProgress || 0, nT = c.todo || 0;
        const parts = [];
        if (nW) parts.push(`<span class="hot"><b>${nW}</b> for you</span>`);
        if (nP) parts.push(`<span class="opt"><b>${nP}</b> in progress</span>`);
        if (nT) parts.push(`<span class="opt"><b>${nT}</b> to do</span>`);
        setHtml($('summary'), parts.length ? parts.join('<span class="opt"> · </span>') : 'All clear');
        const t = (nW ? `(${nW}) ` : '') + 'session-board';
        if (document.title !== t) document.title = t;
        favicon(nW);
      }

      // ---- detail panel -------------------------------------------------------------------------
      let panelDirty = false;
      async function openPanel(key, push = true) {
        state.ticket = key;
        writeUrl(push);
        highlight();
        let t;
        try { t = await api('tickets/' + encodeURIComponent(key)); } catch (e) { toast(e.message); closePanel(); return; }
        if (state.ticket !== key) return;
        renderPanel(t);
      }
      function closePanel(push = true) {
        if (!state.ticket && $('panel').hidden) return;
        state.ticket = '';
        panelDirty = false;
        $('panel').hidden = true;
        $('scrim').hidden = true;
        writeUrl(push);
        highlight();
      }
      function highlight() {
        document.querySelectorAll('.card.sel, .row.sel').forEach((el) => el.classList.remove('sel'));
        if (state.ticket) document.querySelectorAll(`[data-open="${CSS.escape(state.ticket)}"]`).forEach((el) => el.classList.add('sel'));
      }
      const sel = (name, value, opts) => `<select name="${name}">${opts.map(([v, l]) => `<option value="${esc(v)}"${String(value ?? '') === v ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
      /** "CI bot → You": who acted, and who it was for when there is someone. */
      function fromTo(e) {
        return who(e.actor) + (e.target ? `<span class="arrow">→</span>${who(e.target)}` : '');
      }
      function eventLine(e) {
        const by = fromTo(e);
        const at = `<time title="${esc(new Date(e.at).toLocaleString())}">${esc(when(e.at))}</time>`;
        if (e.type === 'comment') return `<div class="ev comment">${by} commented${at}<div class="said">${md(e.text)}</div></div>`;
        if (e.type === 'created') return `<div class="ev">${who(e.actor)} created it${e.to_status ? ' as ' + esc(STATUS[e.to_status] || e.to_status) : ''}${e.target ? `<span class="arrow">→</span>${who(e.target)}` : ''}${at}</div>`;
        if (e.type === 'status' || e.type === 'reopened') return `<div class="ev">${by} ${e.type === 'reopened' ? 'reopened it' : 'moved it'}: ${esc(STATUS[e.from_status] || e.from_status)} → <b>${esc(STATUS[e.to_status] || e.to_status)}</b>${at}${e.text ? `<div class="said">${md(e.text)}</div>` : ''}</div>`;
        if (e.type === 'assigned') return `<div class="ev">${who(e.actor)} handed it over<span class="arrow">→</span>${who(e.target || e.text)}${at}</div>`;
        if (e.type === 'edit') return `<div class="ev">${by} edited ${esc(e.text || 'it')}${at}</div>`;
        if (e.type === 'agent') return `<div class="ev agent">${by} ${md(e.text || '')}${at}</div>`;
        return `<div class="ev ${esc(e.type)}">${by} ${md(e.text || e.type)}${at}</div>`;
      }
      function depList(list, rel) {
        if (!list?.length) return '<div class="empty" style="padding:6px 8px;text-align:left">None</div>';
        return list
          .map((d) => `<div class="dep${d.status === 'done' || d.status === 'cancelled' ? ' closed' : ''}" data-open="${esc(d.key)}"><span class="dot" data-s="${esc(d.status)}"></span><span class="k">${esc(d.key)}</span><span class="tt" title="${esc(d.title)}">${esc(d.title)}</span><button type="button" class="rm" data-undep="${esc(d.key)}" data-rel="${rel}" title="Remove this dependency" aria-label="Remove">×</button></div>`)
          .join('');
      }
      const assigneeOpts = (cur) => {
        const list = [['user', 'You'], ['claude', 'Claude'], ...[...actors.values()].filter((a) => !['user', 'claude', 'hook'].includes(a.id) && a.type !== 'system').map((a) => [a.id, (a.type === 'subagent' ? '↳ ' : '') + a.name])];
        if (cur && !list.some(([v]) => v === cur)) list.push([cur, actorName(cur)]);
        return list;
      };
      function renderPanel(t) {
        panelDirty = false;
        const now = Date.now();
        learnActors(t.actors);
        const ctx = [];
        if (t.repo) ctx.push(`<button type="button" class="tag" data-filter="repo" data-value="${esc(t.repo)}">${esc(t.repo)}</button>`);
        if (t.branch && t.branch !== 'HEAD') ctx.push(`<span class="tag">⎇ ${esc(t.branch)}</span>`);
        if (t.machine) ctx.push(`<span class="tag">${t.origin === 'cloud' ? '☁ cloud' : esc(t.machine)}</span>`);
        ctx.push(`<span class="tag">from ${esc(t.source === 'hook' ? 'hooks' : t.source)}</span>`);
        const sess = t.session_id ? `<div class="ctx"><button type="button" class="tag" data-filter="session" data-value="${esc(t.session_id)}">${t.origin === 'cloud' ? '☁ ' : ''}${esc(sessionName(t))}</button><span class="tag">${esc(ACT[t.session?.activity] || t.session?.activity || '')}</span>${t.session?.url ? `<a class="tag" href="${esc(t.session.url)}" target="_blank" rel="noopener">Open ↗</a>` : ''}</div>` : '<span class="lab">—</span>';
        const links = (t.links || []).map((l) => (httpsUrl(l.url) ? `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.title || (l.type === 'pr' ? 'Pull request ' + l.url.replace(/^https:\/\/[^/]+\//, '') : l.type === 'session' ? 'Cloud session' : l.url))} ↗</a>` : `<span class="mono">${esc(l.url)}</span>`)).join('');
        const kids = (t.children || []).map((c) => `<div class="kid" data-open="${esc(c.key)}"><span class="dot" data-s="${esc(c.status)}"></span><span class="k">${esc(c.key)}</span><span class="tt">${esc(c.title)}</span><span class="pill" data-s="${esc(c.status)}">${esc(STATUS[c.status])}</span></div>`).join('');
        $('panel').innerHTML = `
          <div class="pHead"><span class="dot" data-s="${esc(t.status)}"></span><span class="pkey">${esc(t.key)} · ${esc(t.kind)}</span>${isOpen(t) ? `<button type="button" class="pDone" data-done="${esc(t.key)}" data-from="${esc(t.status)}" aria-label="Mark ${esc(t.key)} as done" title="Mark done (d)">${CHECK}<span>Done</span><kbd>d</kbd></button>` : ''}<button type="button" class="x" data-act="close" aria-label="Close">×</button></div>
          <form class="pBody" id="tform" autocomplete="off">
            <textarea class="pTitle" name="title" rows="1" maxlength="200" aria-label="Title">${esc(t.title)}</textarea>
            <div class="fields">
              <label>Status</label>${sel('status', t.status, Object.entries(STATUS))}
              <label>Assignee</label>${sel('assignee', t.assignee, assigneeOpts(t.assignee))}
              <label>Priority</label>${sel('priority', t.priority || '', [['', 'None'], ['P0', 'P0 · now'], ['P1', 'P1 · next'], ['P2', 'P2 · normal'], ['P3', 'P3 · later']])}
              ${t.kind === 'feedback' ? `<label>Type</label>${sel('subtype', t.subtype || 'suggestion', [['bug', 'Bug'], ['suggestion', 'Suggestion'], ['friction', 'Friction']])}` : ''}
              <label>Labels</label><input name="labels" value="${esc((t.labels || []).join(', '))}" placeholder="comma, separated">
              <span class="lab">Session</span>${sess}
              <span class="lab">Context</span><div class="ctx">${ctx.join('')}</div>
              ${t.parent_key ? `<span class="lab">Parent</span><div class="ctx"><button type="button" class="tag" data-open="${esc(t.parent_key)}">${esc(t.parent_key)} ${esc((t.parent_title || '').slice(0, 50))}</button></div>` : ''}
              <span class="lab">Created</span><span>${t.created_by ? who(t.created_by) + ' · ' : ''}${esc(when(t.created_at))} · updated ${ago(t.updated_at, now)} ago</span>
            </div>
            ${t.kind === 'feedback' && t.status !== 'done' && t.status !== 'cancelled' ? `<div class="resolve"><textarea id="resolution" placeholder="Resolution: what was done, or why not (kept in the history)"></textarea><div class="acts"><button type="button" class="btn" data-act="fbCancel">Won't do</button><button type="button" class="btn primary" data-act="fbDone">Mark handled</button></div></div>` : ''}
            <div class="formActs" id="saveBar" hidden><span class="msg" id="saveMsg"></span><button type="button" class="btn ghost" data-act="revert">Discard</button><button type="submit" class="btn primary">Save</button></div>
            <div class="sect">Description <button type="button" class="clear" data-act="editBody">Edit</button></div>
            <div class="md${t.body ? '' : ' empty-body'}" id="bodyView">${t.body ? md(t.body) : 'No description.'}</div>
            <textarea name="body" id="bodyEdit" hidden>${esc(t.body || '')}</textarea>
            ${links ? `<div class="sect">Links</div><div class="links">${links}</div>` : ''}
            ${kids ? `<div class="sect">Sub-tickets</div><div class="kids">${kids}</div>` : ''}
            ${t.kind === 'feedback' ? '' : `<div class="sect">Dependencies ${t.blocked ? '<span class="tag blocked">⛔ blocked</span>' : ''}</div>
            <div class="depCols">
              <div><h4>Blocked by</h4><div class="deps">${depList(t.blocked_by, 'by')}</div><div class="depAdd"><input id="addBlocker" placeholder="SB-12" aria-label="Add a ticket that blocks this one" autocomplete="off"><button type="button" class="btn" data-act="addBlocker">Add</button></div></div>
              <div><h4>Blocks</h4><div class="deps">${depList(t.blocking, 'blocks')}</div><div class="depAdd"><input id="addBlocked" placeholder="SB-14" aria-label="Add a ticket this one blocks" autocomplete="off"><button type="button" class="btn" data-act="addBlocked">Add</button></div></div>
            </div>`}
            <div class="sect">History</div>
            <div class="timeline">${(t.events || []).map(eventLine).join('')}</div>
            <div class="compose"><textarea id="comment" placeholder="Add a comment…" aria-label="Comment"></textarea><div class="acts"><button type="button" class="btn" data-act="newChild">Add sub-ticket</button><button type="button" class="btn" data-act="comment">Comment</button></div></div>
          </form>`;
        $('panel').hidden = false;
        $('scrim').hidden = false;
        $('panel').dataset.key = t.key;
        $('panel').__ticket = t;
        autosize($('panel').querySelector('.pTitle'));
      }
      function renderCreate(prefill = {}) {
        state.ticket = '';
        writeUrl(false);
        const f = state.f;
        $('panel').innerHTML = `
          <div class="pHead"><span class="pkey">New ticket${prefill.parent ? ' under ' + esc(prefill.parent) : ''}</span><button type="button" class="x" data-act="close" aria-label="Close">×</button></div>
          <form class="pBody" id="cform" autocomplete="off">
            <textarea class="pTitle" name="title" rows="1" maxlength="200" placeholder="What needs doing?" aria-label="Title" required></textarea>
            <div class="fields">
              <label>Status</label>${sel('status', 'todo', [['todo', 'To do'], ['in_progress', 'In progress'], ['waiting_on_user', 'Waiting on you']])}
              <label>Assignee</label>${sel('assignee', 'user', [['user', 'You'], ['claude', 'Claude']])}
              <label>Priority</label>${sel('priority', '', [['', 'None'], ['P0', 'P0 · now'], ['P1', 'P1 · next'], ['P2', 'P2 · normal'], ['P3', 'P3 · later']])}
              <label>Labels</label><input name="labels" value="${esc(f.label || '')}" placeholder="comma, separated">
              <label>Repo</label><input name="repo" value="${esc(prefill.repo || (f.repo && f.repo.includes('/') ? f.repo : ''))}" placeholder="owner/name (optional)">
            </div>
            <textarea name="body" placeholder="Details (markdown)"></textarea>
            <div class="formActs" style="margin-top:12px"><span class="msg" id="saveMsg"></span><button type="button" class="btn ghost" data-act="close">Cancel</button><button type="submit" class="btn primary">Create</button></div>
          </form>`;
        $('panel').dataset.parent = prefill.parent || '';
        $('panel').dataset.session = prefill.session || f.session || '';
        $('panel').hidden = false;
        $('scrim').hidden = false;
        setTimeout(() => $('panel').querySelector('.pTitle').focus(), 30);
      }
      function autosize(el) {
        if (!el) return;
        el.style.height = 'auto';
        el.style.height = el.scrollHeight + 'px';
      }
      function formValues(form) {
        const v = Object.fromEntries(new FormData(form));
        v.title = String(v.title || '').trim();
        v.labels = String(v.labels || '').split(',').map((s) => s.trim()).filter(Boolean);
        return v;
      }

      // ---- events -------------------------------------------------------------------------------
      document.addEventListener('click', async (e) => {
        const el = e.target.closest('[data-done],[data-undep],[data-filter],[data-unfilter],[data-view],[data-act],[data-open],[data-stop]');
        if (!el) return;
        if (el.dataset.stop) return;
        if (el.dataset.done) {
          // The ✓ sits inside a card: closing must not also open it.
          e.preventDefault();
          e.stopPropagation();
          return markDone(el.dataset.done, el.dataset.from);
        }
        if (el.dataset.undep) {
          e.stopPropagation();
          const t = $('panel').__ticket;
          if (!t) return;
          try {
            if (el.dataset.rel === 'by') await api(`tickets/${encodeURIComponent(t.key)}`, { blocked_by_remove: [el.dataset.undep] });
            else await api(`tickets/${encodeURIComponent(el.dataset.undep)}`, { blocked_by_remove: [t.key] });
            await openPanel(t.key, false);
          } catch (err) { toast(err.message); }
          return;
        }
        if (el.dataset.filter) {
          e.preventDefault();
          e.stopPropagation();
          if (window.matchMedia('(max-width: 900px)').matches) closePanel(false);
          return setFilter(el.dataset.filter, el.dataset.value);
        }
        if (el.dataset.unfilter) return setFilter(el.dataset.unfilter, '');
        if (el.dataset.view) {
          if (state.view === el.dataset.view && el.dataset.view === 'feedback') state.view = 'board';
          else state.view = el.dataset.view;
          writeUrl(true);
          renderFilters();
          return refresh();
        }
        if (el.dataset.open) return openPanel(el.dataset.open);
        const act = el.dataset.act;
        if (act === 'close') return closePanel();
        if (act === 'new') return renderCreate();
        if (act === 'clear') {
          state.f = {};
          state.q = '';
          $('q').value = '';
          writeUrl(true);
          renderFilters();
          return refresh();
        }
        if (act === 'archived') {
          state.archived = !state.archived;
          writeUrl(true);
          renderFilters();
          return refresh();
        }
        if (act === 'more') {
          listLimit += 100;
          return refresh();
        }
        const t = $('panel').__ticket;
        if (act === 'editBody') {
          $('bodyView').hidden = true;
          $('bodyEdit').hidden = false;
          $('bodyEdit').focus();
          return;
        }
        if (act === 'revert' && t) return renderPanel(t);
        if ((act === 'addBlocker' || act === 'addBlocked') && t) {
          const input = $(act);
          const k = input.value.trim().toUpperCase().replace(/^(\d+)$/, 'SB-$1');
          if (!/^[A-Z]+-\d+$/.test(k)) return toast('Type a key like SB-12');
          try {
            if (act === 'addBlocker') await api(`tickets/${encodeURIComponent(t.key)}`, { blocked_by_add: [k] });
            else await api(`tickets/${encodeURIComponent(k)}`, { blocked_by_add: [t.key] });
            await openPanel(t.key, false);
          } catch (err) { toast(err.message); }
          return;
        }
        if ((act === 'fbDone' || act === 'fbCancel') && t) {
          const note = $('resolution').value.trim();
          try {
            await api(`tickets/${encodeURIComponent(t.key)}`, { status: act === 'fbDone' ? 'done' : 'cancelled', ...(note ? { comment: note } : {}) });
            await openPanel(t.key, false);
          } catch (err) { toast(err.message); }
          return;
        }
        if (act === 'newChild' && t) return renderCreate({ parent: t.key, repo: t.repo, session: t.session_id });
        if (act === 'comment' && t) {
          const text = $('comment').value.trim();
          if (!text) return;
          try {
            await api(`tickets/${encodeURIComponent(t.key)}/comments`, { text });
            await openPanel(t.key, false);
            refresh();
          } catch (err) { toast(err.message); }
        }
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && (e.target.id === 'addBlocker' || e.target.id === 'addBlocked')) {
          e.preventDefault();
          return document.querySelector(`[data-act="${e.target.id}"]`).click();
        }
        if (e.key === 'Escape' && !$('panel').hidden) return closePanel();
        // `d`: mark done the focused card or row, else the open ticket. Never while typing.
        if ((e.key === 'd' || e.key === 'D') && !e.ctrlKey && !e.metaKey && !e.altKey && !e.target.closest?.('input, textarea, select, [contenteditable]')) {
          const host = e.target.closest?.('[data-open]');
          let btn = host && !host.closest('aside') ? host.querySelector('[data-done]') : null;
          if (!btn && !$('panel').hidden) btn = $('panel').querySelector('.pHead [data-done]');
          if (btn) {
            e.preventDefault();
            return btn.click();
          }
        }
        if (e.key === 'Enter' && e.target.dataset?.open && !e.target.closest('aside')) openPanel(e.target.dataset.open);
        if (e.key === '/' && document.activeElement === document.body) { e.preventDefault(); $('q').focus(); }
      });
      document.addEventListener('change', (e) => {
        const k = e.target.dataset?.pick;
        if (k) return setFilter(k, e.target.value);
      });
      $('panel').addEventListener('input', (e) => {
        if (e.target.classList.contains('pTitle')) autosize(e.target);
        if (['comment', 'addBlocker', 'addBlocked', 'resolution'].includes(e.target.id) || !$('panel').__ticket || $('panel').querySelector('#cform')) return;
        panelDirty = true;
        $('saveBar').hidden = false;
      });
      $('panel').addEventListener('change', (e) => {
        if (!$('panel').querySelector('#tform') || e.target.id === 'comment') return;
        if (['status', 'assignee', 'priority', 'subtype'].includes(e.target.name)) save($('tform'));
      });
      $('panel').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (e.target.id === 'tform') return save(e.target);
        const v = formValues(e.target);
        if (!v.title) return;
        const body = { title: v.title, body: v.body, status: v.status, assignee: v.assignee, labels: v.labels };
        if (v.priority) body.priority = v.priority;
        if (v.repo) body.repo = v.repo;
        if ($('panel').dataset.parent) body.parent = $('panel').dataset.parent;
        if ($('panel').dataset.session) body.session_id = $('panel').dataset.session;
        try {
          const t = await api('tickets', body);
          toast(`${t.key} created`);
          await openPanel(t.key);
          refresh();
        } catch (err) { $('saveMsg').textContent = err.message; }
      });
      async function save(form) {
        const t = $('panel').__ticket;
        if (!t) return;
        const v = formValues(form);
        const body = {};
        if (v.title && v.title !== t.title) body.title = v.title;
        for (const k of ['status', 'assignee']) if (v[k] !== t[k]) body[k] = v[k];
        if (v.subtype && v.subtype !== (t.subtype || 'suggestion')) body.subtype = v.subtype;
        if ((v.priority || null) !== (t.priority || null)) body.priority = v.priority || null;
        if (v.labels.join(',') !== (t.labels || []).join(',')) body.labels = v.labels;
        if (!$('bodyEdit').hidden && v.body !== (t.body || '')) body.body = v.body;
        if (!Object.keys(body).length) return renderPanel(t);
        try {
          const next = await api(`tickets/${encodeURIComponent(t.key)}`, body);
          await openPanel(next.key, false);
          refresh();
        } catch (err) { $('saveMsg').textContent = err.message; $('saveBar').hidden = false; }
      }
      $('scrim').addEventListener('click', () => closePanel());
      let qTimer;
      $('q').addEventListener('input', () => {
        clearTimeout(qTimer);
        qTimer = setTimeout(() => {
          state.q = $('q').value.trim();
          listLimit = 100;
          writeUrl(false);
          renderFilters();
          refresh();
        }, 220);
      });
      window.addEventListener('popstate', () => {
        state = readUrl();
        $('q').value = state.q;
        renderFilters();
        refresh();
        if (state.ticket) openPanel(state.ticket, false);
        else { $('panel').hidden = true; $('scrim').hidden = true; }
      });

      // ---- chrome -------------------------------------------------------------------------------
      let lastIcon = '';
      function favicon(waiting) {
        const accent = getComputedStyle(root).getPropertyValue('--accent').trim() || '#4b5bdc';
        const badge = waiting ? `<circle cx='50' cy='14' r='12' fill='${accent}' stroke='white' stroke-width='4'/>` : '';
        const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='15' fill='#1b1b1f'/><rect x='11' y='14' width='11' height='36' rx='4' fill='${accent}'/><rect x='26.5' y='14' width='11' height='24' rx='4' fill='${accent}' opacity='.6'/><rect x='42' y='14' width='11' height='15' rx='4' fill='${accent}' opacity='.35'/>${badge}</svg>`;
        if (svg === lastIcon) return;
        lastIcon = svg;
        $('favicon').href = 'data:image/svg+xml,' + encodeURIComponent(svg);
      }
      function live(s, text) {
        const el = $('live');
        el.className = 'live ' + s;
        $('liveText').textContent = text;
        el.title = s === 'on' ? 'Live: changes appear as they happen' : s === 'poll' ? 'Live updates unavailable: refreshing every 10 s' : text;
      }
      let isLocked = false;
      function locked() {
        isLocked = true;
        $('auth').hidden = false;
        $('main').hidden = true;
        live('', 'Locked');
        streamCtl?.abort();
      }

      // ---- realtime: Server-Sent Events over fetch (works with a Bearer token and behind a relay) --
      let streamOn = false;
      let streamCtl = null;
      let streamRetry = 1000;
      let lastRefresh = 0;
      function setStream(on) {
        streamOn = on;
        live(on ? 'on' : 'poll', on ? 'Live' : 'Polling');
      }
      async function connectStream() {
        if (streamCtl || isLocked) return;
        const ctl = new AbortController();
        streamCtl = ctl;
        let lastByte = Date.now();
        // Heartbeats come every 15 s: 45 s of silence means a dead connection a proxy did not close.
        const watchdog = setInterval(() => { if (Date.now() - lastByte > 45000) ctl.abort(); }, 5000);
        try {
          const res = await fetch('api/stream', { headers: headers(), cache: 'no-store', signal: ctl.signal });
          if (res.status === 401) { locked(); return; }
          if (!res.ok || !res.body) throw new Error('HTTP ' + res.status);
          const reader = res.body.getReader();
          const dec = new TextDecoder();
          let buf = '';
          for (;;) {
            const { value, done } = await reader.read();
            if (done) break;
            lastByte = Date.now();
            buf += dec.decode(value, { stream: true });
            let i;
            while ((i = buf.indexOf('\n\n')) >= 0) {
              const block = buf.slice(0, i);
              buf = buf.slice(i + 2);
              onBlock(block);
            }
          }
        } catch {} finally {
          clearInterval(watchdog);
          streamCtl = null;
        }
        if (isLocked) return;
        setStream(false);
        setTimeout(connectStream, streamRetry);
        streamRetry = Math.min(streamRetry * 2, 30000);
      }
      function onBlock(block) {
        let ev = 'message';
        let data = '';
        for (const line of block.split('\n')) {
          if (line.startsWith('event:')) ev = line.slice(6).trim();
          else if (line.startsWith('data:')) data += line.slice(5).trim();
        }
        if (ev === 'hello') {
          streamRetry = 1000;
          setStream(true);
          refresh(); // whatever changed while we were not connected
          return;
        }
        if (ev !== 'change') return;
        try { onChange(JSON.parse(data)); } catch {}
      }
      let changeTimer;
      let facetsTimer;
      let panelTimer;
      function onChange(c) {
        if (c.key) changedKeys.add(c.key);
        if (c.blocker) changedKeys.add(c.blocker);
        clearTimeout(changeTimer);
        // Session heartbeats only move a dot: they can wait a little and batch.
        // A card folding away after a ✓ redraws when it is done folding, not halfway.
        const later = () => {
          if (closing.size) changeTimer = setTimeout(later, 80);
          else if (!document.hidden) refresh();
        };
        changeTimer = setTimeout(later, c.type === 'session' ? 2000 : 120);
        if (c.type !== 'session') {
          clearTimeout(facetsTimer);
          facetsTimer = setTimeout(loadFacets, 1500);
        }
        if (state.ticket && (c.key === state.ticket || c.blocker === state.ticket || c.type === 'reorder')) {
          clearTimeout(panelTimer);
          panelTimer = setTimeout(() => {
            if (!$('panel').hidden && state.ticket && !panelDirty && !$('panel').contains(document.activeElement)) openPanel(state.ticket, false);
          }, 200);
        }
      }

      // ---- drag and drop: manual order of the To do column and of Next -----------------------
      let dragKey = null;
      const dragEl = () => (dragKey ? document.querySelector(`[draggable="true"][data-open="${CSS.escape(dragKey)}"]`) : null);
      const clearMarks = () => document.querySelectorAll('.drop-before, .drop-after').forEach((x) => x.classList.remove('drop-before', 'drop-after'));
      document.addEventListener('dragstart', (e) => {
        const el = e.target.closest?.('[draggable="true"][data-open]');
        if (!el) return;
        dragKey = el.dataset.open;
        el.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', dragKey);
      });
      document.addEventListener('dragend', () => {
        document.querySelectorAll('.dragging').forEach((x) => x.classList.remove('dragging'));
        clearMarks();
        dragKey = null;
      });
      document.addEventListener('dragover', (e) => {
        const src = dragEl();
        const el = e.target.closest?.('[draggable="true"][data-open]');
        if (!src || !el || el === src || el.parentElement !== src.parentElement) return;
        e.preventDefault();
        const r = el.getBoundingClientRect();
        clearMarks();
        el.classList.add(e.clientY < r.top + r.height / 2 ? 'drop-before' : 'drop-after');
      });
      document.addEventListener('drop', async (e) => {
        const src = dragEl();
        const el = e.target.closest?.('[draggable="true"][data-open]');
        if (!src || !el || el === src) return;
        e.preventDefault();
        const before = el.classList.contains('drop-before');
        const key = dragKey;
        clearMarks();
        if (before) el.before(src);
        else el.after(src);
        try {
          await api(`tickets/${encodeURIComponent(key)}/move`, before ? { before: el.dataset.open } : { after: el.dataset.open });
          changedKeys.add(key);
        } catch (err) { toast(err.message); }
        refresh();
      });
      let toastTimer;
      /** A short message at the bottom; `action` adds one button (Undo). Hovering or focusing it holds it. */
      function toast(text, { html = false, action = null, ms = 2600 } = {}) {
        let el = document.querySelector('.toast');
        if (!el) {
          el = document.createElement('div');
          el.className = 'toast';
          el.setAttribute('role', 'status');
          el.setAttribute('aria-live', 'polite');
          const hold = () => clearTimeout(toastTimer);
          const release = () => { if (!el.contains(document.activeElement)) armToast(el, 2000); };
          el.addEventListener('mouseenter', hold);
          el.addEventListener('focusin', hold);
          el.addEventListener('mouseleave', release);
          el.addEventListener('focusout', () => setTimeout(release, 0));
          document.body.append(el);
        }
        el.innerHTML = `<span class="tmsg">${html ? text : esc(text)}</span>${action ? `<button type="button" class="undo">${esc(action.label)}</button>` : ''}`;
        if (action) {
          el.querySelector('.undo').addEventListener('click', (e) => {
            e.stopPropagation();
            clearTimeout(toastTimer);
            el.remove();
            action.run();
          });
        }
        armToast(el, ms);
      }
      function armToast(el, ms) {
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.remove(), ms);
      }

      // ---- one-click done, with Undo -------------------------------------------------------------
      const closing = new Set();
      const reducedMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      /** The card (or row) folds away toward Done before the board redraws without it: no blink. */
      function foldAway(el) {
        if (reducedMotion() || !el.animate) return Promise.resolve();
        const h = el.getBoundingClientRect().height;
        el.style.overflow = 'hidden';
        el.style.pointerEvents = 'none';
        el.__fold = el.animate(
          [
            { opacity: 1, transform: 'none', height: h + 'px' },
            { opacity: 0, transform: 'translateX(18px) scale(0.98)', height: h + 'px', offset: 0.55 },
            { opacity: 0, transform: 'translateX(18px) scale(0.98)', height: '0px', paddingTop: '0px', paddingBottom: '0px', borderTopWidth: '0px', borderBottomWidth: '0px', marginTop: el.matches('.card') ? '-6px' : '0px' },
          ],
          { duration: 260, easing: 'cubic-bezier(.4, 0, .2, 1)', fill: 'forwards' },
        );
        return el.__fold.finished.catch(() => {});
      }
      function unfold(el) {
        el.__fold?.cancel();
        el.__fold = null;
        el.style.overflow = '';
        el.style.pointerEvents = '';
      }
      async function markDone(key, from) {
        if (!key || closing.has(key)) return;
        closing.add(key);
        const nodes = [...document.querySelectorAll(`#main [data-open="${CSS.escape(key)}"]`)].filter((n) => n.matches('.card, .row, .nrow'));
        // Keyboard users keep their place: focus moves to the next card of the same column.
        const focused = nodes.find((n) => n.contains(document.activeElement));
        const sib = focused && (focused.nextElementSibling?.dataset?.open ? focused.nextElementSibling : focused.previousElementSibling?.dataset?.open ? focused.previousElementSibling : null);
        const nextFocus = sib?.dataset.open || null;
        const folded = Promise.all(nodes.map(foldAway));
        let t;
        try {
          [t] = await Promise.all([api(`tickets/${encodeURIComponent(key)}`, { status: 'done' }), folded]);
        } catch (err) {
          nodes.forEach(unfold);
          closing.delete(key);
          if (err.message !== 'locked') toast(`${key}: ${err.message}`);
          return;
        }
        closing.delete(key);
        changedKeys.add(key);
        await refresh();
        if (nextFocus) document.querySelector(`#main [data-open="${CSS.escape(nextFocus)}"]`)?.focus();
        if (state.ticket === key && !$('panel').hidden) openPanel(key, false);
        const n = t.children_open || 0;
        const kids = n ? ` · <em>${n} sub-ticket${n === 1 ? '' : 's'} still open</em>` : '';
        const prev = from && from !== 'done' ? from : null;
        toast(`<b>${esc(key)}</b> done${kids}`, { html: true, ms: 6000, action: prev ? { label: 'Undo', run: () => undoDone(key, prev) } : null });
      }
      async function undoDone(key, prev) {
        try {
          await api(`tickets/${encodeURIComponent(key)}`, { status: prev });
        } catch (err) {
          if (err.message !== 'locked') toast(`${key}: ${err.message}`);
          return;
        }
        changedKeys.add(key);
        await refresh();
        if (state.ticket === key && !$('panel').hidden) openPanel(key, false);
        toast(`${key} back to ${STATUS[prev] || prev}`);
      }
      $('authForm').addEventListener('submit', (e) => {
        e.preventDefault();
        localStorage.setItem(KEY, $('tok').value.trim());
        boot();
      });

      async function loadFacets() {
        try {
          facets = await api('facets');
          facets.hasCloud = facets.sessions.some((s) => s.origin === 'cloud');
          learnActors(Object.fromEntries((facets.actors || []).map((a) => [a.id, a])));
          const n = facets.feedback?.open || 0;
          $('fbCount').textContent = String(n);
          $('fbCount').classList.toggle('zero', !n);
          $('fbBtn').setAttribute('aria-pressed', String(state.view === 'feedback'));
          renderFilters();
        } catch {}
      }
      async function boot() {
        $('q').value = state.q;
        renderFilters();
        favicon(0);
        isLocked = false;
        await Promise.all([loadFacets(), refresh()]);
        if (state.ticket) openPanel(state.ticket, false);
        connectStream();
      }
      boot();
      // Fallback: poll every 10 s while the live stream is down, and once a minute anyway.
      setInterval(() => { if (!document.hidden && (!streamOn || Date.now() - lastRefresh > 60000)) refresh(); }, 10000);
      setInterval(() => { if (!document.hidden) loadFacets(); }, 60000);
      setInterval(async () => {
        // Keep an open ticket fresh, unless you are editing it (live changes reload it at once).
        if (!streamOn && !$('panel').hidden && state.ticket && !panelDirty && !$('panel').contains(document.activeElement)) openPanel(state.ticket, false);
      }, 15000);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
    })();
  </script>
</body>
</html>
